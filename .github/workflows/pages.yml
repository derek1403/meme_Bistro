# 把 site/ 部署到 GitHub Pages：https://derek1403.github.io/meme_Bistro/
# repo 有 3 GB 以上的圖片，超過 Pages 1 GB 上限，所以只 sparse checkout site/，
# 圖片與卡片由網頁直接從 raw.githubusercontent.com 讀取。
name: Deploy site to Pages

on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site
          sparse-checkout-cone-mode: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
